name: Preview on Pixel 7 Pro

# Captures d'écran sur un émulateur Pixel 7 Pro, sans publier de version.
on:
  push:
    branches: [preview]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on a Pixel 7 Pro emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: ./ci/smoke.sh app.apk screens
      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screens && zip -q ../preview-screens.zip *.png logcat.txt || true
          cd ..
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Aperçu (captures)" --notes "Captures d'écran de travail, pas une version à installer." --target preview
          gh release upload preview preview-screens.zip --clobber
