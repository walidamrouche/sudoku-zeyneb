name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test the puzzle engine
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk sudoku-zeyneb-1.0.${{ github.run_number }}.apk

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sudoku 1.0.${{ github.run_number }}
          body: APK à installer sur le téléphone. Aucune permission, aucune pub, aucune connexion internet.
          files: sudoku-zeyneb-1.0.${{ github.run_number }}.apk
