name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test the puzzle engine
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk sudoku-zeyneb-1.0.${{ github.run_number }}.apk

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sudoku 1.0.${{ github.run_number }}
          body: APK à installer sur le téléphone. Aucune permission, aucune pub, aucune connexion internet.
          files: sudoku-zeyneb-1.0.${{ github.run_number }}.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.${{ github.run_number }} --pattern "*.apk" --output app.apk
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./ci/smoke.sh app.apk screens
      - name: Attach screenshots to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screens && zip -q ../smoke-screens.zip *.png logcat.txt || true
          cd .. && gh release upload v1.0.${{ github.run_number }} smoke-screens.zip --clobber || true
